<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2001x - Spesial Untuk Kamu ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1f4068, #162447, #1a1a2e);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 90%;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #ff6b81; font-size: 22px; margin-bottom: 5px; }
        .lyrics { font-size: 17px; min-height: 50px; margin: 20px 0; font-weight: bold; color: #f1f2f6; }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        .heart {
            position: absolute;
            color: #ff4757;
            font-size: 20px;
            animation: fly 3s linear infinite;
            bottom: -20px;
        }
        @keyframes fly {
            0% { transform: translateY(0) scale(0.6); opacity: 1; }
            100% { transform: translateY(-105vh) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Audio Bawaan yang Pasti Bisa Diputar di HP -->
    <audio id="mySong" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/romantic_music.ogg" type="audio/ogg">
    </audio>

    <div class="container">
        <h1>2001x - Adrian Khalif 💖</h1>
        <p style="font-size: 13px; color: #a4b0be; font-style: italic;">Special Song For You</p>
        
        <div class="lyrics" id="textLirik">Tekan tombol di bawah untuk mulai musik & lirik... ✨</div>
        
        <button id="btnPlay" onclick="playMusic()">Putar Musik 🎶</button>
    </div>

    <script>
        const lirikList = [
            { text: "🎵 Mengapa sepi tanpa kau di sini?", time: 0 },
            { text: "🔥 Tapi tiap bertemu naik darahku lagi...", time: 4000 },
            { text: "⏱️ Semenit menyenangkan, semenit menyebalkan...", time: 8000 },
            { text: "❤️ Katanya ini namanya cinta...", time: 12000 },
            { text: "🌍 Tapi tak ada orang lain, paling kusayang satu bumi!", time: 16000 },
            { text: "✨ Biar dua ribu kali kita bertengkar...", time: 20000 },
            { text: "🤝 Tapi yang penting kau balik baik lagi...", time: 24000 },
            { text: "💖 Janji akur lagi, 2001x!", time: 28000 }
        ];

        let isPlaying = false;
        const song = document.getElementById('mySong');
        const btn = document.getElementById('btnPlay');
        const lirikDiv = document.getElementById('textLirik');

        function playMusic() {
            if (!isPlaying) {
                song.play().then(() => {
                    isPlaying = true;
                    btn.innerText = "Jeda Musik ⏸️";
                    mulaiLirik();
                    mulaiHati();
                }).catch(err => {
                    alert("Ketuk sekali lagi ya untuk mulai!");
                });
            } else {
                song.pause();
                isPlaying = false;
                btn.innerText = "Putar Musik 🎶";
            }
        }

        function mulaiLirik() {
            lirikList.forEach(item => {
                setTimeout(() => {
                    if(isPlaying) {
                        lirikDiv.innerText = item.text;
                    }
                }, item.time);
            });
        }

        function mulaiHati() {
            setInterval(() => {
                if (!isPlaying) return;
                const h = document.createElement('div');
                h.classList.add('heart');
                h.innerHTML = '❤️';
                h.style.left = Math.random() * 100 + 'vw';
                h.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 4000);
            }, 250);
        }
    </script>
</body>
</html>
