<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2001x - Spesial Untuk Kamu ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1f4068, #162447, #1a1a2e);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 90%;
            width: 400px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ff6b81;
        }

        .song-title {
            font-size: 14px;
            color: #a4b0be;
            margin-bottom: 20px;
            font-style: italic;
        }

        .lyrics-box {
            font-size: 18px;
            min-height: 60px;
            margin-bottom: 25px;
            font-weight: 500;
            color: #f1f2f6;
            transition: opacity 0.5s ease-in-out;
        }

        .play-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: 0.3s;
        }

        .play-btn:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }

        .heart {
            position: absolute;
            color: #ff4757;
            font-size: 20px;
            animation: flyUp 4s linear infinite;
            bottom: -20px;
            z-index: 1;
            user-select: none;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(0) scale(0.6);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) scale(1.4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Audio Musik menggunakan link stabil publik -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://upload.wikimedia.org/wikipedia/commons/b/b2/Beethoven_Moonlight_1st_movement.ogg" type="audio/ogg">
        <source src="https://actions.google.com/sounds/v1/ambiences/romantic_music.ogg" type="audio/ogg">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <div class="container">
        <h1>2001x - Adrian Khalif 💖</h1>
        <div class="song-title" id="songInfo">🎶 Special Song For You</div>
        
        <div class="lyrics-box" id="lyricsDisplay">Tekan tombol di bawah untuk mulai musik & melihat lirik... ✨</div>

        <button class="play-btn" id="playButton" onclick="startExperience()">Putar Musik 🎶</button>
    </div>

    <script>
        const lyrics = [
            { text: "🎵 Mengapa sepi tanpa kau di sini?", time: 0 },
            { text: "🔥 Tapi tiap bertemu naik darahku lagi...", time: 5000 },
            { text: "⏱️ Semenit menyenangkan, semenit menyebalkan...", time: 10000 },
            { text: "❤️ Katanya ini namanya cinta...", time: 15000 },
            { text: "🌍 Tapi tak ada orang lain, paling kusayang satu bumi!", time: 20000 },
            { text: "✨ Biar dua ribu kali kita bertengkar...", time: 26000 },
            { text: "🤝 Tapi yang penting kau balik baik lagi...", time: 31000 },
            { text: "💖 Janji akur lagi, 2001x!", time: 36000 }
        ];

        let isPlaying = false;

        function startExperience() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('playButton');

            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                    btn.innerText = "Jeda Musik ⏸️";
                    startLyricsTimer();
                    startHeartAnimation();
                }).catch(e => {
                    console.log("Audio play error:", e);
                    alert("Sentuh tombol sekali lagi untuk memutar musik ya!");
                });
            } else {
                music.pause();
                isPlaying = false;
                btn.innerText = "Putar Musik 🎶";
            }
        }

        function startLyricsTimer() {
            lyrics.forEach((item) => {
                setTimeout(() => {
                    if(isPlaying) {
                        const display = document.getElementById('lyricsDisplay');
                        display.style.opacity = 0;
                        setTimeout(() => {
                            display.innerText = item.text;
                            display.style.opacity = 1;
                        }, 250);
                    }
                }, item.time);
            });
        }

        function startHeartAnimation() {
            setInterval(() => {
                if (!isPlaying) return;
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 300);
        }
    </script>
</body>
</html>
